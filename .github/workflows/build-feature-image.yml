# The release workflow only fires on a `v*` tag, so a feature branch produces no image and there is
# nothing for a cluster to deploy while the work is in progress. This builds one per push, tagged by
# branch and by commit, and creates no tag and no release.
name: Build feature image

on:
  push:
    branches: ['feature/**', 'hotfix/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: w6d-io/kuma

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The branch tag moves, so a cluster can follow the work; the commit tag does not, so a
          # deployment can name exactly what it runs. Never `latest` — that belongs to a release.
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Report what to deploy
        run: |
          echo "### Feature image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
